# Copied Sites are standalone projects and cannot inherit the monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - vite@8.3.8
  - rolldown@1.2.18
  - '@rolldown/binding-android-arm-eabi@1.2.18'
  - '@rolldown/binding-android-arm64@1.2.18'
  - '@rolldown/binding-darwin-arm64@1.2.18'
  - '@rolldown/binding-darwin-x64@1.2.18'
  - '@rolldown/binding-freebsd-x64@1.2.18'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.18'
  - '@rolldown/binding-linux-arm64-gnu@1.2.18'
  - '@rolldown/binding-linux-arm64-musl@1.2.18'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.18'
  - '@rolldown/binding-linux-s390x-gnu@1.2.18'
  - '@rolldown/binding-linux-x64-gnu@1.2.18'
  - '@rolldown/binding-linux-x64-musl@1.2.18'
  - '@rolldown/binding-openharmony-arm64@1.2.18'
  - '@rolldown/binding-win32-arm64-msvc@1.2.18'
  - '@rolldown/binding-win32-x64-msvc@1.2.18'
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  '@babel/core@': 7.29.6
  'brace-expansion@1': 1.1.21
  'brace-expansion@5': 5.0.12
  'browserslist@': 4.28.7
  'esbuild@0.28': 0.28.1
  'fast-uri@': 3.1.9
  'fflate@0.7': 0.7.5
  'js-yaml@': 4.3.2
  'next>baseline-browser-mapping': 2.11.35
  miniflare>sharp: 0.35.5
  miniflare>undici: 7.30.1
  miniflare>ws: 8.21.0
  '@cloudflare/vite-plugin>ws': 8.21.0
